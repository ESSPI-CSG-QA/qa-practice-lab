<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Tindahan Lab</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Mono:wght@400;500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: dark green menu panel on the left, content on the right, mini cart slides in from the right. */
:root{
  --bg:#eef2ef; --surface:#ffffff; --fg:#17251d; --muted:#55645a; --line:#d5ddd7;
  --accent:#14663f; --accent-fg:#ffffff; --accent-soft:#e0efe6;
  --mango:#f2b134; --mango-fg:#3a2600;
  --side:#0f3d2e; --side-fg:#e8f3ec; --side-muted:#a9c4b5; --side-line:#24584a;
  --danger:#b3261e; --ok:#13783f; --warn:#8f5200; --bug:#6d3bbd;
  --font-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-head:"Bricolage Grotesque","Figtree",system-ui,sans-serif;
  --font-mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9db0a4; --line:#28362e;
  --accent:#5cc98d; --accent-fg:#06220f; --accent-soft:#1b3a2a; --side:#0b2a20; --side-line:#1d4a3b;
  --danger:#ff8f86; --ok:#62d391; --warn:#f0b65c; --bug:#b99af0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1613; --surface:#17211c; --fg:#e6efe9; --muted:#9db0a4; --line:#28362e;
  --accent:#5cc98d; --accent-fg:#06220f; --accent-soft:#1b3a2a; --side:#0b2a20; --side-line:#1d4a3b;
  --danger:#ff8f86; --ok:#62d391; --warn:#f0b65c; --bug:#b99af0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3,.brand{font-family:var(--font-head)}
h1{font-size:1.85rem;line-height:1.15;margin:0 0 6px;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:1rem;margin:0}
p{margin:0 0 10px}
a{color:var(--accent)}
code{font-family:var(--font-mono);font-size:.86em;background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.muted,.hint{color:var(--muted)}
.hint{font-size:.88rem}
.lead{color:var(--muted);max-width:66ch;margin-bottom:20px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);gap:24px;max-width:1240px;margin:0 auto;padding-top:16px;align-items:start}
.side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--side);color:var(--side-fg);border-radius:14px;padding:18px 14px;display:flex;flex-direction:column;gap:18px}
.side-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:center;gap:10px;color:var(--side-fg);text-decoration:none;font-weight:700;font-size:1.15rem}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--mango);color:var(--mango-fg);font-weight:700}
.side label{display:block;color:var(--side-muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;margin:0 0 4px;font-weight:600}
.side select{width:100%;font:inherit;color:var(--side-fg);background:transparent;border:1px solid var(--side-muted);border-radius:6px;padding:7px 8px}
.side select option{color:#17251d;background:#fff}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:block;padding:8px 10px;border-radius:7px;color:var(--side-fg);text-decoration:none;font-weight:500}
.side nav a:hover{background:var(--side-line)}
.side nav a[aria-current="page"]{background:var(--mango);color:var(--mango-fg)}
.side-foot{display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--side-line);padding-top:14px}
.side .switch{display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--side-fg);margin:0;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:36px;height:20px;border-radius:10px;background:var(--side-line);position:relative;flex:0 0 auto}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + .track{background:var(--bug)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--mango);outline-offset:2px}
.side .btn{color:var(--side-fg);border-color:var(--side-muted);background:transparent}
.side .btn:hover:not(:disabled){background:var(--side-line)}
.btn.menu-open,.btn.menu-close{display:none}

.content{min-width:0}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:8px 0;background:var(--bg)}
.strip .menu-open{margin-right:auto}
.userchip{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--mango);color:var(--mango-fg);font-size:.78rem;font-weight:600;text-align:center;margin-left:4px}
main{padding-top:12px;min-height:60vh}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}

label{display:block;font-weight:500;margin:12px 0 4px}
label.check,label.radio{display:flex;align-items:center;gap:8px;font-weight:400;margin:6px 0}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=search],input[type=file],select,textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:8px 10px}
input[type=file]{padding:6px}
input[readonly]{cursor:pointer}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.side :focus-visible{outline-color:var(--mango)}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:500;border:1px solid var(--muted);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.1)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{margin:10px 0 0;padding:9px 12px;border-radius:6px;border:1px solid;font-weight:500}
.msg.error{color:var(--danger);border-color:var(--danger)}
.msg.ok{color:var(--ok);border-color:var(--ok)}
.fielderr{color:var(--danger);font-size:.88rem;margin:4px 0 0}
.fielderr:empty{display:none}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;min-width:0}
.panel + .panel{margin-top:16px}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.split .panel + .panel{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:16px}
.grid2 .panel + .panel{margin-top:0}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:16px;border-top:4px solid var(--mango)}
.card:hover{border-color:var(--accent);border-top-color:var(--mango)}
.card h3{color:var(--accent)}
.card .tag{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.creds{width:100%;border-collapse:collapse;font-size:.9rem}
.creds td,.creds th{padding:5px 0;text-align:left;border-bottom:1px solid var(--line)}
.creds td:last-child{font-family:var(--font-mono);font-size:.85rem}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.data{width:100%;border-collapse:collapse;min-width:560px}
table.data th,table.data td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
table.data th button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;gap:6px}
table.data th[aria-sort="ascending"] button::after{content:"\25B2";font-size:.7em}
table.data th[aria-sort="descending"] button::after{content:"\25BC";font-size:.7em}
.num{text-align:right !important;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:.82rem;font-weight:500;border:1px solid}
.pill.delivered{color:var(--ok);border-color:var(--ok)}
.pill.pending{color:var(--warn);border-color:var(--warn)}
.pill.cancelled{color:var(--muted);border-color:var(--muted)}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}

/* shop */
.plist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
.prow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto auto;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.pthumb{width:56px;height:56px;border-radius:10px;background:var(--mango);color:var(--mango-fg);display:grid;place-items:center;font-family:var(--font-mono);font-weight:500}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.stepper{display:flex;align-items:center;gap:4px}
.stepper input{width:58px;text-align:center;padding:6px 4px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end}
.filters label{margin-top:0}
@media (max-width:700px){.prow{grid-template-columns:56px minmax(0,1fr)} .prow > .price,.prow > .stepper,.prow > .btn{grid-column:2}}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 24px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .total{font-weight:600;font-size:1.1rem;color:var(--fg);border-top:1px solid var(--line);padding-top:8px}
.qty{width:76px !important}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:55;width:min(380px,100vw);background:var(--surface);color:var(--fg);border-left:1px solid var(--line);box-shadow:-8px 0 28px rgb(0 0 0 / .22);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) 18px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.drawer[hidden]{display:none}
.drawer ul{list-style:none;margin:0;padding:0}
.drawer li{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}

/* dynamic */
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}.side{transition:none !important}}
.chip{display:inline-block;padding:6px 12px;border:1px dashed var(--muted);border-radius:6px;background:var(--surface);cursor:grab;margin:0 6px 6px 0;user-select:none}
.dropzone{min-height:70px;border:2px dashed var(--accent);border-radius:10px;padding:10px;background:var(--accent-soft)}
.dropzone.over{background:var(--surface)}
.hovermenu{position:relative;display:inline-block}
.hovermenu ul{display:none;position:absolute;left:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:5;box-shadow:0 4px 14px rgb(0 0 0 / .15)}
.hovermenu:hover ul,.hovermenu:focus-within ul{display:block}
.hovermenu li a{display:block;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--fg)}
.hovermenu li a:hover{background:var(--accent-soft)}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgb(8 16 12 / .6);display:grid;place-items:center;z-index:70;padding:16px}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:80;font-weight:500;max-width:calc(100vw - 32px)}

/* registration + calendar */
.dpwrap{position:relative}
.dprow{display:flex;gap:8px;align-items:stretch}
.dprow input{flex:1 1 auto;min-width:0;width:auto}
.dprow .btn{flex:0 0 auto}
.calendar{position:absolute;left:0;top:calc(100% + 4px);z-index:15;width:100%;max-width:480px;background:var(--surface);border:1px solid var(--muted);border-radius:10px;padding:12px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.calendar[hidden]{display:none}
.cal-head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.cal-head select{flex:1 1 0;min-width:0;padding:5px 6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:.75rem;color:var(--muted);padding:4px 0}
.cal-day{font:inherit;font-variant-numeric:tabular-nums;border:0;background:none;color:var(--fg);padding:7px 0;border-radius:5px;cursor:pointer}
.cal-day:hover:not(:disabled){background:var(--accent-soft)}
.cal-day.sel{background:var(--accent);color:var(--accent-fg)}
.cal-day:disabled{color:var(--muted);opacity:.4;cursor:not-allowed}
.cal-foot{display:flex;justify-content:flex-end;margin-top:8px}

/* trainer */
.bugs{display:grid;gap:12px}
.bug{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px}
.bug header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.bug .id{font-family:var(--font-mono);font-weight:500;color:var(--bug)}
.bug .where{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line);padding:0 7px;border-radius:10px;color:var(--muted)}
.bug dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 14px}
.bug dt{color:var(--muted)} .bug dd{margin:0}

@media (max-width:859px){
  .app{grid-template-columns:minmax(0,1fr);gap:0}
  .side{position:fixed;z-index:60;left:max(8px,env(safe-area-inset-left,0px));top:calc(8px + env(safe-area-inset-top,0px));bottom:8px;width:min(300px,calc(100vw - 32px));max-height:none;transform:translateX(-120%);visibility:hidden;transition:transform .2s,visibility .2s}
  .side.open{transform:none;visibility:visible}
  .btn.menu-open,.btn.menu-close{display:inline-block}
}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)} .bug dl{grid-template-columns:1fr}}
</style>

<div class="app">
  <aside class="side" id="sidebar" data-i18n-label="side.label">
    <div class="side-top">
      <a class="brand" href="#home" data-testid="brand" data-i18n-label="brand.home"><span class="logo" aria-hidden="true">T</span><span>Tindahan Lab</span></a>
      <button type="button" class="btn small menu-close" id="menu-close" data-testid="menu-close" data-i18n-label="menu.close">&times;</button>
    </div>
    <div>
      <label for="lang-select" data-i18n="lang.label">Language</label>
      <select id="lang-select" data-testid="lang-select"><option value="en">English</option><option value="fil">Filipino</option></select>
    </div>
    <nav data-i18n-label="nav.label">
      <a href="#home" data-testid="nav-home" data-i18n="nav.home">Home</a>
      <a href="#login" data-testid="nav-login" data-i18n="nav.login">Log in</a>
      <a href="#register" data-testid="nav-register" data-i18n="nav.register">Register</a>
      <a href="#forms" data-testid="nav-forms" data-i18n="nav.forms">Feedback</a>
      <a href="#orders" data-testid="nav-orders" data-i18n="nav.orders">Orders</a>
      <a href="#dynamic" data-testid="nav-dynamic" data-i18n="nav.dynamic">Dynamic</a>
      <a href="#shop" data-testid="nav-shop" data-i18n="nav.shop">Shop</a>
      <a href="#cart" data-testid="nav-cart" data-i18n="nav.cart">Cart</a>
    </nav>
    <div class="side-foot">
      <label class="switch" for="bug-mode"><input type="checkbox" id="bug-mode" data-testid="bug-mode" role="switch" data-i18n-label="bug.label"><span class="track"></span><span data-i18n="bug.label">Bug mode</span></label>
      <button class="btn small" id="reset-data" data-testid="reset-data" type="button" data-i18n="reset">Reset data</button>
    </div>
  </aside>
  <div class="content">
    <header class="strip">
      <button type="button" class="btn small menu-open" id="menu-open" data-testid="menu-open" aria-controls="sidebar" aria-expanded="false" data-i18n="menu.open">Menu</button>
      <span class="userchip" id="user-chip" data-testid="user-chip" role="status" hidden></span>
      <button type="button" class="btn" id="open-cart" data-testid="open-cart" aria-controls="cart-drawer" aria-expanded="false"><span data-i18n="cart.title">Cart</span><span class="badge" id="cart-count" data-testid="cart-count" aria-hidden="true">0</span></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer><span data-i18n="foot">Practice site</span> <a href="#trainer" data-testid="nav-trainer" data-i18n="foot.trainer">Trainer notes</a></footer>
  </div>
</div>
<aside class="drawer" id="cart-drawer" data-testid="cart-drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" hidden>
  <div class="row" style="justify-content:space-between"><h2 id="drawer-title" style="margin:0" data-i18n="drawer.title">Mini cart</h2><button type="button" class="btn small" id="close-cart" data-testid="close-cart" data-i18n-label="drawer.close">&times;</button></div>
  <div id="drawer-body"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite" data-testid="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return (n<10?'0':'')+n};
var peso=function(n){return '₱'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})};

/* ---------- translations: A(key, English, Filipino) ---------- */
var D={en:{},fil:{}};
function A(k,e,f){D.en[k]=e;D.fil[k]=f}
A("side.label","Main menu","Pangunahing menu");
A("brand.home","Tindahan Lab, home","Tindahan Lab, simula");
A("menu.open","Menu","Menu");A("menu.close","Close menu","Isara ang menu");
A("lang.label","Language","Wika");
A("nav.label","Main","Pangunahin");
A("nav.home","Home","Simula");A("nav.login","Log in","Mag-log in");A("nav.register","Register","Magrehistro");
A("nav.forms","Feedback","Puna");A("nav.orders","Orders","Mga order");A("nav.dynamic","Dynamic","Dinamiko");
A("nav.shop","Shop","Tindahan");A("nav.cart","Cart","Kariton");
A("bug.label","Bug mode","Mode ng bug");A("reset","Reset data","I-reset ang data");

/* ---------- shell ---------- */
function applyI18n(){
  document.documentElement.lang=S.lang==='fil'?'fil':'en';
  $$('[data-i18n]').forEach(function(e){e.textContent=t(e.getAttribute('data-i18n'))});
  $$('[data-i18n-label]').forEach(function(e){e.setAttribute('aria-label',t(e.getAttribute('data-i18n-label')))});
  $('#lang-select').value=S.lang;
  $('#bug-mode').checked=S.bug;
}
function qtyTotal(){return Object.keys(S.cart).reduce(function(a,k){return a+S.cart[k]},0)}
function chrome(){
  var n=qtyTotal();
  $('#cart-count').textContent=n;
  $('#open-cart').setAttribute('aria-label',t('cart.aria',{n:n}));
  var c=$('#user-chip');c.hidden=!S.user;c.textContent=S.user?t('user.in',{u:S.user}):'';
  drawer();
}
var views={home:vHome,login:vLogin,register:vRegister,forms:vForms,orders:vOrders,dynamic:vDynamic,shop:vShop,cart:vCart,checkout:vCheckout,trainer:vTrainer};
function route(){
  var name=(location.hash||'#home').slice(1);
  if(!views[name])name='home';
  views[name]();
  $$('.side nav a').forEach(function(a){if(a.getAttribute('href')==='#'+name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  closeMenu();closeDrawer();
  window.scrollTo(0,0);
}
function openMenu(){$('#sidebar').classList.add('open');$('#menu-open').setAttribute('aria-expanded','true')}
function closeMenu(){$('#sidebar').classList.remove('open');$('#menu-open').setAttribute('aria-expanded','false')}
$('#menu-open').onclick=openMenu;$('#menu-close').onclick=closeMenu;
window.addEventListener('hashchange',route);
$('#lang-select').addEventListener('change',function(e){S.lang=e.target.value;save();applyI18n();chrome();route()});
$('#bug-mode').addEventListener('change',function(e){S.bug=e.target.checked;save();toast(t(S.bug?'toast.bugon':'toast.bugoff'));route()});
$('#reset-data').addEventListener('click',function(){var b=S.bug,l=S.lang;S=fresh();S.bug=b;S.lang=l;save();chrome();route();toast(t('toast.reset'))});

/* ---------- login ---------- */
function vLogin(){
  var inner=S.user?
   '<h2>'+t('login.welcome')+'</h2><p id="welcome-msg" data-testid="welcome-msg">'+t('login.signedas',{u:'<b>'+esc(S.user)+'</b>'})+'</p><button class="btn" id="logout-btn" data-testid="logout-btn" type="button">'+t('btn.logout')+'</button>':
   '<h2>'+t('login.h2')+'</h2><form id="login-form" novalidate>'+
   '<label for="username">'+t('f.username')+'</label><input type="text" id="username" name="username" data-testid="username" autocomplete="off">'+
   '<label for="password">'+t('f.password')+'</label><input type="password" id="password" name="password" data-testid="password" autocomplete="off">'+
   '<label class="check"><input type="checkbox" id="remember" data-testid="remember"> '+t('f.remember')+'</label>'+
   '<p class="msg error" id="login-error" data-testid="login-error" role="alert" hidden></p>'+
   '<div class="row" style="margin-top:14px"><button class="btn primary" id="login-submit" data-testid="login-submit" type="submit">'+t('btn.login')+'</button></div></form>';
  main.innerHTML='<h1>'+t('login.h1')+'</h1><p class="lead">'+t('login.lead')+'</p><div class="split"><section class="panel">'+inner+'</section>'+
   '<aside class="panel"><h2>'+t('login.accounts')+'</h2><table class="creds"><tr><th>'+t('f.username')+'</th><th>'+t('f.password')+'</th></tr><tr><td>shopper01</td><td>Password123</td></tr><tr><td>locked_shopper</td><td>Password123</td></tr></table>'+
   '<p class="hint" style="margin-top:10px"><code>locked_shopper</code> '+t('login.lockednote')+'</p>'+
   '<p class="hint">'+t('login.regnote')+' <a href="#register" id="login-to-register">'+t('login.reglink')+'</a>.</p></aside></div>';
  var lo=$('#logout-btn');if(lo)lo.onclick=function(){S.user=null;save();chrome();vLogin();toast(t('toast.logout'))};
  var f=$('#login-form');if(!f)return;
  f.onsubmit=function(e){
    e.preventDefault();
    var u=$('#username').value.trim(),p=$('#password').value,err=$('#login-error');
    var show=function(m){err.textContent=m;err.hidden=false};
    var left=S.lockUntil-Date.now();
    if(left>0){show(t('e.toomany',{s:Math.ceil(left/1000)}));return}
    if(!u){show(t('e.user.req'));return}
    if(!p){show(B()?t('e.user.req'):t('e.pass.req'));return}
    var acct=S.accounts[u]||S.accounts[u.toLowerCase()];
    var known=(u==='shopper01'||u==='locked_shopper'||!!acct),expected=acct?acct.pw:PW;
    var pwOk=B()?p.toLowerCase()===expected.toLowerCase():p===expected;
    if(known&&pwOk){
      if(u==='locked_shopper'){show(t('e.locked'));return}
      S.user=u;S.fails=0;save();chrome();vLogin();toast(t('toast.loginok'));return;
    }
    S.fails++;
    if(S.fails>=3){S.fails=0;S.lockUntil=Date.now()+15000;save();show(t('e.toomany',{s:15}))}
    else{save();show(t('e.invalid',{n:S.fails}))}
  };
}

/* ---------- helpers for forms ---------- */
function fld(id,label,input,key){
  input=input.replace(/^<(input|select|textarea)/,'<$1 aria-required="true" aria-describedby="err-'+key+'"');
  return '<label for="'+id+'">'+label+'</label>'+input+'<p class="fielderr" id="err-'+key+'" data-testid="err-'+key+'" role="alert"></p>';
}
function showErrs(er,keys){
  keys.forEach(function(k){
    var m=$('#err-'+k);if(m)m.textContent=er[k]||'';
    var el=$('#'+k);if(el){if(er[k]&&el.type!=='checkbox')el.setAttribute('aria-invalid','true');else el.removeAttribute('aria-invalid')}
  });
}

   '<div class="row" style="margin-top:16px"><button class="btn primary" id="create-account" data-testid="create-account" type="submit">'+t('btn.create')+'</button></div></form></section>'+

  var cEl=$('#calendar'),inp=$('#birthdate'),btn=$('#open-calendar');

  main.innerHTML='<h1>'+t('cart.h1')+'</h1><div class="split"><section aria-label="'+t('cart.table')+'"><div class="tablewrap"><table class="data" id="cart-table" data-testid="cart-table" aria-label="'+t('cart.table')+'"><thead><tr><th scope="col">'+t('col.product')+'</th><th scope="col" class="num">'+t('col.price')+'</th><th scope="col">'+t('col.qty')+'</th><th scope="col" class="num">'+t('col.line')+'</th><th scope="col"><span style="position:absolute;left:-9999px">'+t('btn.remove')+'</span></th></tr></thead><tbody>'+
   ids.map(function(id){var p=pById(id),nm=pname(p);
     return '<tr data-testid="cart-row-'+id+'"><td>'+esc(nm)+'</td><td class="num">'+peso(p.price)+'</td><td><input type="number" class="qty" id="qty-'+id+'" data-testid="qty-'+id+'" aria-label="'+esc(t('qty.label',{n:nm}))+'" value="'+S.cart[id]+'"></td><td class="num" id="line-'+id+'">'+peso(p.price*S.cart[id])+'</td><td><button class="btn small danger" id="remove-'+id+'" data-testid="remove-'+id+'" type="button" aria-label="'+esc(t('rm.aria',{i:nm}))+'">'+t('btn.remove')+'</button></td></tr>'}).join('')+
   '</tbody></table></div></section>'+
   '<aside class="panel"><h2>'+t('sum.h')+'</h2><div id="cart-summary"></div>'+
   '<label for="coupon-code">'+t('f.coupon')+'</label><div class="row"><input type="text" id="coupon-code" data-testid="coupon-code" style="flex:1 1 120px;width:auto" placeholder="TIPID10"><button class="btn" id="apply-coupon" data-testid="apply-coupon" type="button">'+t('btn.apply')+'</button></div>'+
   '<p class="msg" id="coupon-msg" data-testid="coupon-msg" role="status" hidden></p>'+
   '<div class="row" style="margin-top:16px"><a class="btn primary" id="checkout-btn" data-testid="checkout-btn" href="#checkout">'+t('btn.checkout')+'</a></div></aside></div>';
  var paint=function(){$('#cart-summary').innerHTML=summaryHtml(totals())};
  paint();
  ids.forEach(function(id){
    var p=pById(id);
    $('#qty-'+id).onchange=function(e){
      var n=Math.max(1,Math.floor(Number(e.target.value))||1);e.target.value=n;S.cart[id]=n;save();chrome();
      $('#line-'+id).textContent=peso(p.price*n);
      if(!B())paint();
    };
    $('#remove-'+id).onclick=function(){delete S.cart[id];if(!Object.keys(S.cart).length)S.coupons=0;save();chrome();vCart()};
  });
  $('#apply-coupon').onclick=function(){
    var code=$('#coupon-code').value.trim().toUpperCase(),m=$('#coupon-msg');m.hidden=false;
    if(code!=='TIPID10'){m.className='msg error';m.textContent=t('c.invalid');return}
    if(S.coupons>=1&&!B()){m.className='msg error';m.textContent=t('c.already');return}
    S.coupons++;save();m.className='msg ok';m.textContent=t('c.applied');paint();
  };
}
function vCheckout(){
  if(!Object.keys(S.cart).length&&!B()){location.hash='#cart';return}
  var x=totals();
  main.innerHTML='<h1>'+t('co.h1')+'</h1><div class="split"><section class="panel"><h2>'+t('co.h2')+'</h2><form id="co-form" novalidate>'+
   fld('co-name',t('f.name'),'<input type="text" id="co-name" data-testid="co-name">','co-name')+
   fld('co-address',t('f.address'),'<input type="text" id="co-address" data-testid="co-address">','co-address')+
   fld('co-card',t('f.card'),'<input type="text" id="co-card" data-testid="co-card" inputmode="numeric" placeholder="4111 1111 1111 1111">','co-card')+
   fld('co-exp',t('f.exp'),'<input type="text" id="co-exp" data-testid="co-exp" placeholder="09/29">','co-exp')+
   '<div class="row" style="margin-top:16px"><button class="btn primary" id="place-order" data-testid="place-order" type="submit">'+t('btn.place')+'</button></div></form></section>'+
   '<aside class="panel"><h2>'+t('sum.h')+'</h2>'+summaryHtml(x)+'</aside></div>';
  $('#co-form').onsubmit=function(e){
    e.preventDefault();
    var v={n:$('#co-name').value.trim(),a:$('#co-address').value.trim(),c:$('#co-card').value.replace(/\s+/g,''),x:$('#co-exp').value.trim()},er={};
    if(!v.n)er['co-name']=t('e.co.name');
    if(!v.a)er['co-address']=t('e.co.addr');
    if(!/^\d{16}$/.test(v.c))er['co-card']=t('e.co.card');
    if(!/^(0[1-9]|1[0-2])\/\d{2}$/.test(v.x))er['co-exp']=t('e.co.exp');
    showErrs(er,['co-name','co-address','co-card','co-exp']);
    if(Object.keys(er).length)return;
    var no='TL-'+(++S.orders);S.cart={};S.coupons=0;save();chrome();
    main.innerHTML='<h1>'+t('ordered.h')+'</h1><section class="panel"><p class="msg ok" id="order-confirmation" data-testid="order-confirmation">'+t('ordered.msg',{n:esc(v.n),o:no})+'</p>'+
     '<dl class="kv" style="margin-top:14px"><dt>'+t('o.number')+'</dt><dd id="order-number" data-testid="order-number">'+no+'</dd><dt>'+t('o.amount')+'</dt><dd id="order-total" data-testid="order-total">'+peso(x.total)+'</dd><dt>'+t('o.ship')+'</dt><dd>'+esc(v.a)+'</dd></dl>'+
     '<p style="margin-top:16px"><a class="btn" href="#shop">'+t('btn.continue')+'</a></p></section>';
  };
}

/* ---------- trainer notes (English only) ---------- */
var unlocked=false;
function vTrainer(){
  if(!unlocked){
    main.innerHTML='<h1>Trainer notes</h1><p class="lead">The list of hidden bugs. Enter the trainer passcode to continue. This only keeps trainees from opening it by accident; it is not real security.</p>'+
     '<section class="panel" style="max-width:420px"><form id="tr-form"><label for="trainer-pass" style="margin-top:0">Passcode</label><input type="password" id="trainer-pass" data-testid="trainer-pass" autocomplete="off"><p class="msg error" id="tr-err" role="alert" hidden>Wrong passcode.</p><div class="row" style="margin-top:14px"><button class="btn primary" type="submit" id="trainer-submit">Open</button></div></form><p class="hint" style="margin-top:12px">Passcode: <code>trainer123</code></p></section>';
    $('#tr-form').onsubmit=function(e){e.preventDefault();if($('#trainer-pass').value==='trainer123'){unlocked=true;vTrainer()}else $('#tr-err').hidden=false};
    return;
  }
  main.innerHTML='<h1>Trainer notes</h1><p class="lead">'+BUGS.length+' planted bugs. They only appear while <b>Bug mode</b> is on (currently <b>'+(S.bug?'on':'off')+'</b>). The notes themselves are in English. Steps use the English screen text; in Filipino mode use the matching translated text.</p>'+
   '<div class="bugs">'+BUGS.map(function(b){return '<article class="bug" data-testid="bug-'+b.id+'" aria-label="'+b.id+' '+b.title+'"><header><span class="id">'+b.id+'</span><strong>'+b.title+'</strong><span class="where">#'+b.page+'</span></header><dl><dt>Steps</dt><dd>'+b.steps+'</dd><dt>Expected</dt><dd>'+b.exp+'</dd><dt>With bug</dt><dd>'+b.act+'</dd></dl></article>'}).join('')+'</div>'+
   '<section class="panel" style="margin-top:20px"><h2>Intentional obstacle (always on)</h2><p>On <b>#register</b> Date of birth is the first field. The calendar stays open after a date is picked and covers First name, Last name, Email and part of Password, so a script that clicks the next field fails with an element click intercepted error. Workarounds trainees should find: press Escape, press the Pick a date button again, or fill the field without clicking it (for example Playwright fill).</p></section>'+
   '<section class="panel" style="margin-top:20px"><h2>Language exercise ideas</h2><p>Write one test with a role locator that uses visible text, for example the Add to cart button. Run it in English, then switch to Filipino and watch it fail. Fix it by using a test ID or by reading the text from a translation table.</p><p>Check that dates, prices and error messages change language but stay correct. Prices always use the peso sign with two decimals.</p><p style="margin:0">Translations were written for practice. Ask a Filipino speaker on your team to review the wording before using it in a formal training.</p></section>';
}

/* ---------- accessibility names and roles, re-applied after every page change ---------- */
var secN=0;
function a11y(){
  $$('section,aside',main).forEach(function(s){
    var h=s.querySelector('h1,h2,h3');
    if(h&&!s.hasAttribute('aria-label')&&!s.hasAttribute('aria-labelledby')){if(!h.id)h.id='sec-h'+(++secN);s.setAttribute('aria-labelledby',h.id)}
  });
  $$('form',main).forEach(function(f){
    if(!f.hasAttribute('aria-label')){var s=f.closest('section'),h=s&&s.querySelector('h2');f.setAttribute('aria-label',h?h.textContent:'Form')}
  });
  $$('.chip',main).forEach(function(c){c.setAttribute('role','button');c.setAttribute('tabindex','0');c.setAttribute('aria-label',t('drag.aria',{n:c.dataset.name}))});
  var dz=$('#drop-zone',main);if(dz)dz.setAttribute('role','region');
  var hb=$('#hover-btn',main);
  if(hb){hb.setAttribute('aria-haspopup','menu');$('#hover-list').setAttribute('role','menu');$$('#hover-list li').forEach(function(li){li.setAttribute('role','none')});$$('#hover-list a').forEach(function(a){a.setAttribute('role','menuitem')})}
  $$('.fielderr[id^="err-"]',main).forEach(function(p){
    var c=$('#'+p.id.slice(4),main)||p.closest('fieldset');
    if(c&&!c.hasAttribute('aria-describedby'))c.setAttribute('aria-describedby',p.id);
  });
}
new MutationObserver(a11y).observe(main,{childList:true,subtree:true});

applyI18n();chrome();route();a11y();
})();
</script>
