<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QA Practice Lab</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky top bar, one centered column, each practice page is a self-contained "level". */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --fg:#1a2330; --muted:#586374; --line:#d9dee6;
  --accent:#0a6b73; --accent-fg:#ffffff; --accent-soft:#e1f1f2;
  --danger:#b3261e; --ok:#13783f; --warn:#8f5200; --bug:#6d3bbd;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1a2129; --fg:#e7ebf0; --muted:#9ba6b5; --line:#2d3743;
  --accent:#58c2c9; --accent-fg:#07242a; --accent-soft:#17323a;
  --danger:#ff8f86; --ok:#62d391; --warn:#f0b65c; --bug:#b99af0; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1a2129; --fg:#e7ebf0; --muted:#9ba6b5; --line:#2d3743;
  --accent:#58c2c9; --accent-fg:#07242a; --accent-soft:#17323a;
  --danger:#ff8f86; --ok:#62d391; --warn:#f0b65c; --bug:#b99af0; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1040px;margin:0 auto}
a{color:var(--accent)}
h1{font-size:1.75rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
h2{font-size:1.1rem;margin:0 0 10px}
h3{font-size:.95rem;margin:0 0 6px}
p{margin:0 0 10px}
code,.mono{font-family:var(--font-mono);font-size:.88em}
code{background:var(--accent-soft);padding:1px 5px;border-radius:3px}
.lead{color:var(--muted);max-width:68ch;margin-bottom:20px}
.muted{color:var(--muted)}

/* top bar */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding-inline:max(16px,env(safe-area-inset-left,0px))}
.top-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:10px}
.brand{font-weight:600;letter-spacing:.01em;text-decoration:none;color:var(--fg);display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--accent)}
nav{display:flex;flex-wrap:wrap;gap:2px;flex:1;min-width:0}
nav a{padding:6px 10px;border-radius:5px;text-decoration:none;color:var(--muted);font-weight:500}
nav a:hover{background:var(--accent-soft);color:var(--fg)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--accent);color:var(--accent-fg);font-size:.78rem;text-align:center;margin-left:4px}
.tools{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.switch{display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--muted);font-weight:500;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{width:36px;height:20px;border-radius:10px;background:var(--line);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--muted);transition:transform .15s}
.switch input:checked + .track{background:var(--bug)}
.switch input:checked + .track::after{transform:translateX(16px)}
.switch input:focus-visible + .track{outline:2px solid var(--accent);outline-offset:2px}
.userchip{font-family:var(--font-mono);font-size:.85rem;color:var(--muted)}

main{padding-top:28px;min-height:60vh}

/* controls */
label{display:block;font-weight:500;margin:12px 0 4px}
label.check,label.radio{display:flex;align-items:center;gap:8px;font-weight:400;margin:6px 0}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=search],input[type=file],select,textarea{
  width:100%;font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--muted);border-radius:6px;padding:8px 10px}
input[type=file]{padding:6px}
textarea{min-height:84px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[aria-invalid="true"],select[aria-invalid="true"],textarea[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 1px var(--danger)}
input[type=checkbox],input[type=radio]{width:16px;height:16px;accent-color:var(--accent)}
.btn{font:inherit;font-weight:500;border:1px solid var(--muted);background:var(--surface);color:var(--fg);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--accent-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.small{padding:4px 10px;font-size:.9rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.msg{margin:10px 0 0;padding:9px 12px;border-radius:6px;border:1px solid;font-weight:500}
.msg.error{color:var(--danger);border-color:var(--danger)}
.msg.ok{color:var(--ok);border-color:var(--ok)}
.fielderr{color:var(--danger);font-size:.88rem;margin:4px 0 0;min-height:0}
.fielderr:empty{display:none}
.hint{color:var(--muted);font-size:.88rem}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;min-width:0}
.panel + .panel{margin-top:16px}
.split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:16px;align-items:start}
.split .panel + .panel{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.grid2 .panel + .panel{margin-top:0}
.card{display:flex;flex-direction:column;gap:8px;text-decoration:none;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:16px}
.card:hover{border-color:var(--accent)}
.card h3{color:var(--accent);margin:0}
.card .tag{font-family:var(--font-mono);font-size:.8rem;color:var(--muted)}
.creds{width:100%;border-collapse:collapse;font-size:.9rem}
.creds td,.creds th{padding:5px 0;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
.creds td:last-child{font-family:var(--font-mono);font-size:.85rem}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 16px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.data{width:100%;border-collapse:collapse;min-width:520px}
table.data th,table.data td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
table.data th{font-size:.82rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--bg)}
table.data th button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;cursor:pointer;padding:0;display:inline-flex;gap:6px}
table.data th[aria-sort="ascending"] button::after{content:"\25B2";font-size:.7em}
table.data th[aria-sort="descending"] button::after{content:"\25BC";font-size:.7em}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:1px 9px;border-radius:10px;font-size:.82rem;font-weight:500;border:1px solid}
.pill.Active{color:var(--ok);border-color:var(--ok)}
.pill.Inactive{color:var(--muted);border-color:var(--muted)}
.pill.On{color:var(--warn);border-color:var(--warn)}
.pager{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}

/* shop */
.tile{height:92px;border-radius:6px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);font-family:var(--font-mono);font-weight:500}
.price{font-variant-numeric:tabular-nums;font-weight:600}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 24px;margin:0}
.sum dt{color:var(--muted)} .sum dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.sum .total{font-weight:600;font-size:1.1rem;color:var(--fg);border-top:1px solid var(--line);padding-top:8px}
.qty{width:72px !important}

/* dynamic */
.spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.4s}}
.chip{display:inline-block;padding:6px 12px;border:1px dashed var(--muted);border-radius:6px;background:var(--surface);cursor:grab;margin:0 6px 6px 0;user-select:none}
.dropzone{min-height:70px;border:2px dashed var(--accent);border-radius:8px;padding:10px;background:var(--accent-soft)}
.dropzone.over{background:var(--surface)}
.hovermenu{position:relative;display:inline-block}
.hovermenu ul{display:none;position:absolute;left:0;top:100%;margin:4px 0 0;padding:6px;list-style:none;min-width:170px;background:var(--surface);border:1px solid var(--line);border-radius:6px;z-index:5;box-shadow:0 4px 14px rgb(0 0 0 / .15)}
.hovermenu:hover ul,.hovermenu:focus-within ul{display:block}
.hovermenu li a{display:block;padding:6px 10px;border-radius:4px;text-decoration:none;color:var(--fg)}
.hovermenu li a:hover{background:var(--accent-soft)}
.items{list-style:none;margin:0;padding:0}
.items li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}
.overlay{position:fixed;inset:0;background:rgb(10 14 20 / .55);display:grid;place-items:center;z-index:40;padding:16px}
.overlay[hidden]{display:none}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;max-width:380px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;z-index:50;font-weight:500;max-width:calc(100vw - 32px)}

/* registration + calendar */
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
@media (max-width:520px){.two{grid-template-columns:minmax(0,1fr)}}
.dpwrap{position:relative}
.dprow{display:flex;gap:8px;align-items:stretch}
.dprow input{flex:1 1 auto;min-width:0;width:auto}
.dprow .btn{flex:0 0 auto}
input[readonly]{cursor:pointer}
.calendar{position:absolute;left:0;top:calc(100% + 4px);z-index:15;width:100%;max-width:480px;background:var(--surface);border:1px solid var(--muted);border-radius:8px;padding:12px;box-shadow:0 8px 24px rgb(0 0 0 / .25)}
.calendar[hidden]{display:none}
.cal-head{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.cal-head select{flex:1 1 0;min-width:0;padding:5px 6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-dow{font-size:.75rem;color:var(--muted);padding:4px 0}
.cal-day{font:inherit;font-variant-numeric:tabular-nums;border:0;background:none;color:var(--fg);padding:7px 0;border-radius:5px;cursor:pointer}
.cal-day:hover:not(:disabled){background:var(--accent-soft)}
.cal-day.sel{background:var(--accent);color:var(--accent-fg)}
.cal-day:disabled{color:var(--muted);opacity:.4;cursor:not-allowed}
.cal-foot{display:flex;justify-content:flex-end;margin-top:8px}

/* trainer */
.bugs{display:grid;gap:12px}
.bug{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:14px 16px}
.bug header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.bug .id{font-family:var(--font-mono);font-weight:500;color:var(--bug)}
.bug .where{font-family:var(--font-mono);font-size:.8rem;border:1px solid var(--line);padding:0 7px;border-radius:10px;color:var(--muted)}
.bug dl{margin:0;display:grid;grid-template-columns:max-content 1fr;gap:3px 14px}
.bug dt{color:var(--muted)} .bug dd{margin:0}
footer{margin-top:44px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.85rem}
@media (max-width:760px){.split{grid-template-columns:minmax(0,1fr)} .bug dl{grid-template-columns:1fr}}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#home" data-testid="brand" aria-label="QA Practice Lab, home"><i></i>QA Practice Lab</a>
  <nav aria-label="Main">
    <a href="#login" data-testid="nav-login">Login</a>
    <a href="#register" data-testid="nav-register">Register</a>
    <a href="#forms" data-testid="nav-forms">Forms</a>
    <a href="#table" data-testid="nav-table">Table</a>
    <a href="#dynamic" data-testid="nav-dynamic">Dynamic</a>
    <a href="#shop" data-testid="nav-shop">Shop</a>
    <a href="#cart" data-testid="nav-cart" id="nav-cart" aria-label="Cart, 0 items">Cart<span class="badge" id="cart-count" data-testid="cart-count" aria-hidden="true">0</span></a>
  </nav>
  <div class="tools">
    <span class="userchip" id="user-chip" data-testid="user-chip" role="status" hidden></span>
    <label class="switch" for="bug-mode" style="margin:0"><input type="checkbox" id="bug-mode" data-testid="bug-mode" role="switch" aria-label="Bug mode"><span class="track"></span>Bug mode</label>
    <button class="btn small" id="reset-data" data-testid="reset-data" type="button" aria-label="Reset data">Reset data</button>
  </div>
</div></header>

<div class="wrap">
  <main id="main" tabindex="-1"></main>
  <footer>Practice site for test automation training. Nothing here is real: no data leaves your browser. <a href="#trainer" data-testid="nav-trainer">Trainer notes</a></footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" data-testid="toast" hidden></div>

<script>
(function(){
"use strict";
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var money=function(n){return '$'+n.toFixed(2)};

/* ---------- state (kept in localStorage when allowed, so a page reload keeps the session) ---------- */
function fresh(){return {bug:false,user:null,fails:0,lockUntil:0,cart:{},coupons:0,orders:1000,accounts:{}}}
var S=fresh();
try{var raw=localStorage.getItem('qalab-v1'); if(raw){S=Object.assign(fresh(),JSON.parse(raw))}}catch(e){}
function save(){try{localStorage.setItem('qalab-v1',JSON.stringify(S))}catch(e){}}
var B=function(){return S.bug};

var main=$('#main');
var toastTimer=null;
function toast(m){var t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3000)}

/* ---------- data ---------- */
var PRODUCTS=[
 {id:'aviator',name:'Aviator Classic',price:99,tag:'AV'},
 {id:'round',name:'Round Metal',price:79,tag:'RM'},
 {id:'square',name:'Square Acetate',price:59.5,tag:'SQ'},
 {id:'sport',name:'Sport Wrap',price:120,tag:'SW'},
 {id:'reader',name:'Reading Glasses',price:25,tag:'RG'},
 {id:'cloth',name:'Lens Cleaning Kit',price:49,tag:'LK'}
];
var PW='Password123';

var BUGS=[
 {id:'B01',page:'login',title:'Password is not case sensitive',steps:'Log in as standard_user with the password "password123" (all lowercase).',exp:'Error: Invalid username or password.',act:'Login succeeds.'},
 {id:'B02',page:'login',title:'Wrong message for empty password',steps:'Enter a username, leave the password blank, press Log in.',exp:'"Password is required"',act:'"Username is required"'},
 {id:'B03',page:'forms',title:'Email validation too weak',steps:'Submit the form with the email "kevin@test" (no dot in the domain).',exp:'Error: Enter a valid email address.',act:'Email is accepted.'},
 {id:'B04',page:'forms',title:'Age lower limit is not checked',steps:'Enter an age of 5, 0 or -3 and submit.',exp:'Error: Age must be between 18 and 99.',act:'Age is accepted.'},
 {id:'B05',page:'forms',title:'Only the first interest is saved',steps:'Tick two or more interests and submit with valid data.',exp:'The summary lists every ticked interest.',act:'Only the first one is listed.'},
 {id:'B06',page:'table',title:'Salary sorts as text',steps:'Click the Salary header to sort ascending.',exp:'900, 1,000 ... 9,400 in numeric order.',act:'Text order: 1,000 and 1,100 come before 900.'},
 {id:'B07',page:'table',title:'Search is case sensitive',steps:'Type "ana" and then "Ana" in the search box.',exp:'Both return the same rows.',act:'Lowercase "ana" returns nothing.'},
 {id:'B08',page:'table',title:'Next button works on the last page',steps:'Go to the last page and press Next.',exp:'Next is disabled on the last page.',act:'Next stays enabled and shows an empty page.'},
 {id:'B09',page:'dynamic',title:'Cancel also deletes the item',steps:'Press Delete on an item, then press Cancel in the dialog.',exp:'The item stays in the list.',act:'The item is removed.'},
 {id:'B10',page:'dynamic',title:'Upload shows wrong file size unit',steps:'Upload any file larger than 1 KB.',exp:'Size shown in KB (for example 12.4 KB).',act:'Same number shown as MB.'},
 {id:'B11',page:'cart',title:'Totals do not refresh after changing quantity',steps:'Add an item, change its quantity to 3 on the Cart page.',exp:'Subtotal, tax and total update straight away.',act:'Summary stays old until the page is reloaded.'},
 {id:'B12',page:'cart',title:'Coupon can be stacked',steps:'Apply SAVE10 two or three times.',exp:'Second try shows "Coupon already applied".',act:'Discount grows by 10% each time.'},
 {id:'B13',page:'cart',title:'Free shipping threshold is off by one cent',steps:'Build a cart with a subtotal of exactly $100.00 (4 x Reading Glasses).',exp:'Shipping is $0.00 (free from $100).',act:'Shipping is $8.00.'},
 {id:'B14',page:'cart',title:'Checkout allowed with an empty cart',steps:'Empty the cart and open #checkout directly.',exp:'Redirect back to the cart.',act:'The checkout form opens and an order can be placed.'},
 {id:'B15',page:'register',title:'Password mismatch is accepted',steps:'Enter different values in Password and Confirm password, fill everything else correctly, and create the account.',exp:'Error: Passwords do not match.',act:'The account is created.'},
 {id:'B16',page:'register',title:'Calendar saves the day before',steps:'Open the calendar and click the 15th of any month.',exp:'The Date of birth field shows the 15th.',act:'The field shows the 14th.'},
 {id:'B17',page:'register',title:'Duplicate email check is case sensitive',steps:'Register kev@test.com. Then register again with KEV@test.com.',exp:'Error: An account with this email already exists.',act:'A second account is created.'}
];

/* ---------- router ---------- */
var views={home:vHome,login:vLogin,register:vRegister,forms:vForms,table:vTable,dynamic:vDynamic,shop:vShop,cart:vCart,checkout:vCheckout,trainer:vTrainer};
function route(){
  var name=(location.hash||'#home').slice(1);
  if(!views[name])name='home';
  views[name]();
  $$('nav a').forEach(function(a){
    if(a.getAttribute('href')==='#'+name)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  if(name==='checkout')$('#nav-cart').setAttribute('aria-current','page');
  window.scrollTo(0,0);
}
function chrome(){
  var n=Object.keys(S.cart).reduce(function(a,k){return a+S.cart[k]},0);
  $('#cart-count').textContent=n;
  $('#nav-cart').setAttribute('aria-label','Cart, '+n+(n===1?' item':' items'));
  var c=$('#user-chip');c.hidden=!S.user;c.textContent=S.user?('signed in: '+S.user):'';
  $('#bug-mode').checked=S.bug;
}
window.addEventListener('hashchange',route);
$('#bug-mode').addEventListener('change',function(e){S.bug=e.target.checked;save();toast(S.bug?'Bug mode on':'Bug mode off');route()});
$('#reset-data').addEventListener('click',function(){var b=S.bug;S=fresh();S.bug=b;save();chrome();route();toast('Data reset')});

/* ---------- home ---------- */
function vHome(){
  main.innerHTML='<h1>QA Practice Lab</h1>'+
  '<p class="lead">A small website built to be tested. Use it to practice manual test cases first, then automate the same steps with Selenium, Playwright, Cypress or any tool you are learning.</p>'+
  '<div class="grid">'+
   card('login','Login','Valid and invalid sign-in, error messages, lockout after 3 failed tries, session kept on reload.')+
   card('register','Register','Shop-style sign-up with password rules, duplicate email check and a calendar date picker that covers other fields.')+
   card('forms','Forms','Text, email, number, dropdown, radio, checkbox, date, text area, validation errors and a result summary.')+
   card('table','Table','Search, filter, sort, page size and pagination on 35 rows.')+
   card('dynamic','Dynamic','Spinners, delayed buttons, pop-up dialog, toast, drag and drop, file upload, hover menu, changing IDs.')+
   card('shop','Shop and checkout','Add to cart, change quantity, coupon, shipping and tax maths, checkout, order confirmation.')+
  '</div>'+
  '<div class="grid2" style="margin-top:16px">'+

function vLogin(){
  var inner;
  if(S.user){
    inner='<h2>Welcome</h2><p id="welcome-msg" data-testid="welcome-msg">You are signed in as <b>'+esc(S.user)+'</b>.</p><button class="btn" id="logout-btn" data-testid="logout-btn" type="button">Log out</button>';
  }else{
    inner='<h2>Sign in</h2><form id="login-form" novalidate>'+
     '<label for="username">Username or email</label><input type="text" id="username" name="username" data-testid="username" autocomplete="off">'+
     '<label for="password">Password</label><input type="password" id="password" name="password" data-testid="password" autocomplete="off">'+
     '<label class="check"><input type="checkbox" id="remember" data-testid="remember"> Remember me</label>'+
     '<p class="msg error" id="login-error" data-testid="login-error" role="alert" hidden></p>'+
     '<div class="row" style="margin-top:14px"><button class="btn primary" id="login-submit" data-testid="login-submit" type="submit">Log in</button></div></form>';
  }
  main.innerHTML='<h1>Login</h1><p class="lead">Practice positive and negative login tests. The form has three attempts, then locks for 15 seconds.</p>'+
   '<div class="split"><section class="panel">'+inner+'</section>'+
   '<aside class="panel"><h2>Test accounts</h2><table class="creds"><tr><th>Username</th><th>Password</th></tr>'+
   '<tr><td>standard_user</td><td>Password123</td></tr><tr><td>locked_user</td><td>Password123</td></tr></table>'+
   '<p class="hint" style="margin-top:10px"><code>locked_user</code> has the right password but the account is locked.</p><p class="hint">Registered your own account? Log in with its email and password. New here? <a href="#register" id="login-to-register">Create an account</a>.</p></aside></div>';
  var lo=$('#logout-btn');
  if(lo)lo.onclick=function(){S.user=null;save();chrome();vLogin();toast('Logged out')};
  var f=$('#login-form'); if(!f)return;
  f.onsubmit=function(e){
    e.preventDefault();
    var u=$('#username').value.trim(),p=$('#password').value,err=$('#login-error');
    var show=function(m){err.textContent=m;err.hidden=false};
    var left=S.lockUntil-Date.now();
    if(left>0){show('Too many failed attempts. Try again in '+Math.ceil(left/1000)+' seconds.');return}
    if(!u){show('Username is required');return}
    if(!p){show(B()?'Username is required':'Password is required');return}
    var acct=S.accounts[u]||S.accounts[u.toLowerCase()];
    var known=(u==='standard_user'||u==='locked_user'||!!acct);
    var expected=acct?acct.pw:PW;
    var pwOk=B()?p.toLowerCase()===expected.toLowerCase():p===expected;
    if(known&&pwOk){
      if(u==='locked_user'){show('Sorry, this account has been locked.');return}
      S.user=u;S.fails=0;save();chrome();vLogin();toast('Login successful');return;
    }
    S.fails++;
    if(S.fails>=3){S.fails=0;S.lockUntil=Date.now()+15000;save();show('Too many failed attempts. Try again in 15 seconds.')}
    else{save();show('Invalid username or password. Attempt '+S.fails+' of 3.')}
  };
}

  $('#status-filter').onchange=function(e){T.status=e.target.value;T.page=1;draw()};
  $('#page-size').onchange=function(e){T.size=Number(e.target.value);T.page=1;draw()};
  $$('th[data-key] button').forEach(function(b){b.onclick=function(){var k=b.parentNode.dataset.key;if(T.key===k)T.dir=-T.dir;else{T.key=k;T.dir=1}draw()}});
  $('#prev-page').onclick=function(){if(T.page>1){T.page--;draw()}};
  $('#next-page').onclick=function(){T.page++;draw()};
  draw();
}
function draw(){
  var q=B()?T.q:T.q.toLowerCase();
  var rows=ROWS.filter(function(r){
    var hay=B()?(r.name+' '+r.dept):(r.name+' '+r.dept).toLowerCase();
    return (!q||hay.indexOf(q)>-1)&&(T.status==='All'||r.status===T.status);
  });
  rows.sort(function(a,b){
    var x=a[T.key],y=b[T.key];
    if(T.key==='salary'&&B()){x=String(x);y=String(y)}
    return (x<y?-1:x>y?1:0)*T.dir;
  });
  var pages=Math.max(1,Math.ceil(rows.length/T.size));
  if(!B()&&T.page>pages)T.page=pages;
  var start=(T.page-1)*T.size,slice=rows.slice(start,start+T.size);
  $('#emp-body').innerHTML=slice.length?slice.map(function(r){
    return '<tr data-testid="row-'+r.id+'"><td class="num">'+r.id+'</td><td>'+r.name+'</td><td>'+r.dept+'</td><td><span class="pill '+r.status.split(' ')[0]+'">'+r.status+'</span></td><td class="num">'+r.salary.toLocaleString('en-US')+'</td></tr>';
  }).join(''):'<tr><td colspan="5" id="no-results" data-testid="no-results" class="muted" style="white-space:normal">No matching employees. Clear the search or choose another status.</td></tr>';
  $$('th[data-key]').forEach(function(th){th.setAttribute('aria-sort',th.dataset.key===T.key?(T.dir>0?'ascending':'descending'):'none')});
  $('#page-info').textContent=slice.length?('Showing '+(start+1)+' to '+(start+slice.length)+' of '+rows.length):('Showing 0 of '+rows.length);
  $('#page-num').textContent='Page '+T.page+' of '+pages;
  $('#prev-page').disabled=T.page<=1;
  $('#next-page').disabled=B()?false:T.page>=pages;
}

  var pending=null;
  main.innerHTML='<h1>Dynamic behavior</h1><p class="lead">Things that change after the page loads. These are the usual cause of flaky automated tests, so practice waiting for them properly.</p>'+
  '<div class="grid2">'+
   '<section class="panel"><h2>1. Loading spinner</h2><p class="hint">Result appears after about 2 seconds.</p><div class="row"><button class="btn primary" id="load-btn" data-testid="load-btn" type="button">Load report</button><span class="spinner" id="spinner" data-testid="spinner" role="progressbar" aria-label="Loading" hidden></span></div><p id="report-result" data-testid="report-result" style="margin-top:10px" hidden>Report ready: 42 records loaded.</p></section>'+
   '<section class="panel"><h2>2. Delayed element</h2><p class="hint">A new button is added to the page 3 seconds after you start.</p><div class="row" id="delay-row"><button class="btn" id="start-timer" data-testid="start-timer" type="button">Start timer</button></div></section>'+

   '<section class="panel"><h2>4. Toast message</h2><p class="hint">Disappears by itself after 3 seconds.</p><button class="btn" id="toast-btn" data-testid="toast-btn" type="button">Show toast</button></section>'+
   '<section class="panel"><h2>5. Drag and drop</h2><div id="chips"><span class="chip" draggable="true" id="chip-frame" data-name="Frame">Frame</span><span class="chip" draggable="true" id="chip-lens" data-name="Lens">Lens</span><span class="chip" draggable="true" id="chip-case" data-name="Case">Case</span></div><div class="dropzone" id="drop-zone" data-testid="drop-zone" aria-label="Drop zone"></div><p class="hint" id="drop-status" data-testid="drop-status" style="margin:8px 0 0">Nothing dropped yet.</p></section>'+

   '<section class="panel"><h2>7. Hover menu</h2><div class="hovermenu"><button class="btn" id="hover-btn" data-testid="hover-btn" type="button">Hover over me</button><ul id="hover-list" data-testid="hover-list"><li><a href="#dynamic" id="hover-profile">Profile</a></li><li><a href="#dynamic" id="hover-help">Help</a></li></ul></div><p class="hint" id="hover-status" style="margin:8px 0 0">Menu items show on hover or keyboard focus.</p></section>'+
   '<section class="panel"><h2>8. Changing ID</h2><p class="hint">This button gets a new ID on every page load, and has no test ID. Find it by its text or class.</p><button class="btn dyn-btn" id="btn-'+Math.random().toString(36).slice(2,8)+'" type="button">Button with changing ID</button><p id="dyn-status" class="hint" style="margin:8px 0 0"></p></section>'+
  '</div>'+
  '<div class="overlay" id="confirm-overlay" hidden><div class="dialog" id="confirm-dialog" data-testid="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-title"><h2 id="dlg-title">Delete item?</h2><p id="dlg-text" class="muted"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="dlg-cancel" data-testid="dlg-cancel" type="button">Cancel</button><button class="btn danger" id="dlg-confirm" data-testid="dlg-confirm" type="button">Delete</button></div></div></div>';

  $('#load-btn').onclick=function(){
    var b=$('#load-btn');b.disabled=true;$('#report-result').hidden=true;$('#spinner').hidden=false;
    setTimeout(function(){$('#spinner').hidden=true;$('#report-result').hidden=false;b.disabled=false},2000);
  };
  $('#start-timer').onclick=function(){
    var b=$('#start-timer');b.disabled=true;b.textContent='Waiting...';
    setTimeout(function(){
      var n=document.createElement('button');n.className='btn primary';n.id='delayed-btn';n.setAttribute('data-testid','delayed-btn');n.type='button';n.textContent='I am here now';
      n.onclick=function(){toast('Delayed button clicked')};
      $('#delay-row').appendChild(n);b.textContent='Start timer';b.disabled=false;

  function list(){
    $('#item-list').innerHTML=items.length?items.map(function(t,i){return '<li data-testid="item-'+i+'"><span>'+t+'</span><button class="btn small danger" data-item="'+t+'" aria-label="Delete '+t+'" id="del-'+t.toLowerCase().replace(/\s+/g,'-')+'" type="button">Delete</button></li>'}).join(''):'<li id="list-empty" data-testid="list-empty" class="muted">All items deleted. Press Reset data to start over.</li>';
    $$('#item-list button').forEach(function(b){b.onclick=function(){pending=b.dataset.item;$('#dlg-text').textContent='"'+pending+'" will be removed from the list.';$('#confirm-overlay').hidden=false;$('#dlg-cancel').focus()}});

  $$('.hovermenu a').forEach(function(a){a.onclick=function(e){e.preventDefault();$('#hover-status').textContent='You chose: '+a.textContent}});
  $('.dyn-btn').onclick=function(){$('#dyn-status').textContent='Clicked at '+new Date().toLocaleTimeString()};

/* ---------- shop ---------- */
function vShop(){
  main.innerHTML='<h1>Shop</h1><p class="lead">Add products to the cart, then open the cart to change quantities, apply a coupon and check out.</p><div class="grid" id="products">'+
   PRODUCTS.map(function(p){return '<article class="card" data-testid="product-'+p.id+'"><div class="tile">'+p.tag+'</div><h3 style="color:var(--fg)">'+p.name+'</h3><span class="price" id="price-'+p.id+'">'+money(p.price)+'</span><button class="btn primary" id="add-'+p.id+'" data-testid="add-'+p.id+'" type="button">Add to cart</button></article>'}).join('')+'</div>';
  PRODUCTS.forEach(function(p){$('#add-'+p.id).onclick=function(){S.cart[p.id]=(S.cart[p.id]||0)+1;save();chrome();toast(p.name+' added to cart')}});
}
function totals(){
  var sub=0;Object.keys(S.cart).forEach(function(id){var p=PRODUCTS.filter(function(x){return x.id===id})[0];if(p)sub+=p.price*S.cart[id]});
  var disc=Math.min(sub,sub*0.1*S.coupons);
  var ship=sub===0?0:(B()?(sub>100?0:8):(sub>=100?0:8));
  var tax=(sub-disc)*0.08;
  return {sub:sub,disc:disc,ship:ship,tax:tax,total:sub-disc+ship+tax};
}
function summaryHtml(t){
  return '<dl class="sum"><dt>Subtotal</dt><dd id="sum-sub" data-testid="sum-sub">'+money(t.sub)+'</dd>'+
  '<dt>Discount</dt><dd id="sum-disc" data-testid="sum-disc">-'+money(t.disc)+'</dd>'+
  '<dt>Shipping (free from $100)</dt><dd id="sum-ship" data-testid="sum-ship">'+money(t.ship)+'</dd>'+
  '<dt>Tax (8%)</dt><dd id="sum-tax" data-testid="sum-tax">'+money(t.tax)+'</dd>'+
  '<dt class="total">Total</dt><dd class="total" id="sum-total" data-testid="sum-total">'+money(t.total)+'</dd></dl>';
}
function vCart(){
  var ids=Object.keys(S.cart);
  if(!ids.length){
    main.innerHTML='<h1>Cart</h1><section class="panel"><p id="cart-empty" data-testid="cart-empty">Your cart is empty.</p><a class="btn primary" href="#shop" id="go-shop" style="text-decoration:none;display:inline-block">Browse products</a></section>'+
      (B()?'<p class="hint" style="margin-top:12px"><a href="#checkout">Checkout</a></p>':'');
    return;
  }
  main.innerHTML='<h1>Cart</h1><div class="split"><section><div class="tablewrap"><table class="data" id="cart-table" data-testid="cart-table"><thead><tr><th scope="col">Product</th><th scope="col" class="num">Price</th><th scope="col">Qty</th><th scope="col" class="num">Line total</th><th scope="col"><span style="position:absolute;left:-9999px">Remove</span></th></tr></thead><tbody>'+
   ids.map(function(id){var p=PRODUCTS.filter(function(x){return x.id===id})[0];
     return '<tr data-testid="cart-row-'+id+'"><td>'+p.name+'</td><td class="num">'+money(p.price)+'</td><td><input type="number" min="1" class="qty" id="qty-'+id+'" data-testid="qty-'+id+'" aria-label="Quantity for '+p.name+'" value="'+S.cart[id]+'"></td><td class="num" id="line-'+id+'">'+money(p.price*S.cart[id])+'</td><td><button class="btn small danger" id="remove-'+id+'" data-testid="remove-'+id+'" type="button">Remove</button></td></tr>'}).join('')+
   '</tbody></table></div></section>'+
   '<aside class="panel"><h2>Order summary</h2><div id="cart-summary"></div>'+
   '<label for="coupon-code">Coupon code</label><div class="row"><input type="text" id="coupon-code" data-testid="coupon-code" style="flex:1 1 120px;width:auto" placeholder="SAVE10"><button class="btn" id="apply-coupon" data-testid="apply-coupon" type="button">Apply</button></div>'+
   '<p class="msg" id="coupon-msg" data-testid="coupon-msg" hidden></p>'+
   '<div class="row" style="margin-top:16px"><a class="btn primary" id="checkout-btn" data-testid="checkout-btn" href="#checkout" style="text-decoration:none">Checkout</a></div></aside></div>';
  var paint=function(){$('#cart-summary').innerHTML=summaryHtml(totals())};
  paint();
  ids.forEach(function(id){
    var p=PRODUCTS.filter(function(x){return x.id===id})[0];
    $('#qty-'+id).onchange=function(e){
      var n=Math.max(1,Math.floor(Number(e.target.value))||1);e.target.value=n;S.cart[id]=n;save();chrome();
      $('#line-'+id).textContent=money(p.price*n);
      if(!B())paint();
    };
    $('#remove-'+id).onclick=function(){delete S.cart[id];save();chrome();if(!Object.keys(S.cart).length)S.coupons=0;save();vCart()};
  });
  $('#apply-coupon').onclick=function(){
    var code=$('#coupon-code').value.trim().toUpperCase(),m=$('#coupon-msg');m.hidden=false;
    if(code!=='SAVE10'){m.className='msg error';m.textContent='Invalid coupon code';return}
    if(S.coupons>=1&&!B()){m.className='msg error';m.textContent='Coupon already applied';return}
    S.coupons++;save();m.className='msg ok';m.textContent='Coupon applied: 10% off';paint();
  };
}
function vCheckout(){
  if(!Object.keys(S.cart).length&&!B()){location.hash='#cart';return}
  var t=totals();
  main.innerHTML='<h1>Checkout</h1><div class="split"><section class="panel"><h2>Delivery and payment</h2><form id="co-form" novalidate>'+
   fld('co-name','Full name','<input type="text" id="co-name" data-testid="co-name">','co-name')+
   fld('co-address','Address','<input type="text" id="co-address" data-testid="co-address">','co-address')+
   fld('co-card','Card number (16 digits)','<input type="text" id="co-card" data-testid="co-card" inputmode="numeric" placeholder="4111 1111 1111 1111">','co-card')+
   fld('co-exp','Expiry (MM/YY)','<input type="text" id="co-exp" data-testid="co-exp" placeholder="09/29">','co-exp')+
   '<div class="row" style="margin-top:16px"><button class="btn primary" id="place-order" data-testid="place-order" type="submit">Place order</button></div></form></section>'+
   '<aside class="panel"><h2>Order summary</h2>'+summaryHtml(t)+'</aside></div>';
  var f=$('#co-form');
  f.onsubmit=function(e){
    e.preventDefault();
    var v={n:$('#co-name').value.trim(),a:$('#co-address').value.trim(),c:$('#co-card').value.replace(/\s+/g,''),x:$('#co-exp').value.trim()};
    var er={};
    if(!v.n)er['co-name']='Name is required';
    if(!v.a)er['co-address']='Address is required';
    if(!/^\d{16}$/.test(v.c))er['co-card']='Enter a 16 digit card number';
    var mm=/^(0[1-9]|1[0-2])\/(\d{2})$/.exec(v.x);
    if(!mm)er['co-exp']='Use the format MM/YY';
    ['co-name','co-address','co-card','co-exp'].forEach(function(k){
      $('#err-'+k).textContent=er[k]||'';
      if(er[k])$('#'+k).setAttribute('aria-invalid','true');else $('#'+k).removeAttribute('aria-invalid');
    });
    if(Object.keys(er).length)return;
    var no='QA-'+(++S.orders);
    S.cart={};S.coupons=0;save();chrome();
    main.innerHTML='<h1>Order placed</h1><section class="panel"><p class="msg ok" id="order-confirmation" data-testid="order-confirmation">Thank you, '+esc(v.n)+'. Your order '+no+' has been placed.</p>'+
      '<dl class="kv" style="margin-top:14px"><dt>Order number</dt><dd id="order-number" data-testid="order-number">'+no+'</dd><dt>Amount charged</dt><dd id="order-total" data-testid="order-total">'+money(t.total)+'</dd><dt>Ship to</dt><dd>'+esc(v.a)+'</dd></dl>'+
      '<p style="margin-top:16px"><a class="btn" href="#shop" style="text-decoration:none;display:inline-block">Continue shopping</a></p></section>';
  };
}

/* ---------- trainer notes ---------- */
var unlocked=false;
function vTrainer(){
  if(!unlocked){
    main.innerHTML='<h1>Trainer notes</h1><p class="lead">The list of hidden bugs. Enter the trainer passcode to continue. This only keeps trainees from opening it by accident; it is not real security.</p>'+
     '<section class="panel" style="max-width:420px"><form id="tr-form"><label for="trainer-pass" style="margin-top:0">Passcode</label><input type="password" id="trainer-pass" data-testid="trainer-pass" autocomplete="off"><p class="msg error" id="tr-err" role="alert" hidden>Wrong passcode.</p><div class="row" style="margin-top:14px"><button class="btn primary" type="submit" id="trainer-submit">Open</button></div></form><p class="hint" style="margin-top:12px">Passcode: <code>trainer123</code></p></section>';
    $('#tr-form').onsubmit=function(e){e.preventDefault();if($('#trainer-pass').value==='trainer123'){unlocked=true;vTrainer()}else $('#tr-err').hidden=false};
    return;
  }
  main.innerHTML='<h1>Trainer notes</h1><p class="lead">'+BUGS.length+' planted bugs. They only appear while <b>Bug mode</b> is on (currently <b>'+(S.bug?'on':'off')+'</b>). Each one has a correct behavior you can use as the expected result in a test case.</p>'+
   '<div class="bugs">'+BUGS.map(function(b){return '<article class="bug" data-testid="bug-'+b.id+'"><header><span class="id">'+b.id+'</span><strong>'+b.title+'</strong><span class="where">#'+b.page+'</span></header><dl><dt>Steps</dt><dd>'+b.steps+'</dd><dt>Expected</dt><dd>'+b.exp+'</dd><dt>With bug</dt><dd>'+b.act+'</dd></dl></article>'}).join('')+'</div>'+
   '<section class="panel" style="margin-top:20px"><h2>Intentional obstacle (always on)</h2><p>On <b>#register</b> Date of birth is the first field. The calendar stays open after a date is picked and covers First name, Last name, Email and part of Password, so a script that clicks the next field fails with an element click intercepted error. Workarounds trainees should find: press Escape, or fill the field without clicking it (for example Playwright fill; Selenium sendKeys behaves similarly). This teaches them to deal with pop-ups that cover the next element.</p></section><section class="panel" style="margin-top:20px"><h2>Exercise ideas</h2><p>Manual: write test cases for one page, swap with a partner, run them with Bug mode on, and log each defect.</p><p>Automation: write the same flows as scripts with Bug mode off. Then turn it on and see which scripts fail and why.</p><p style="margin:0">Waiting: automate the Dynamic page without fixed sleeps. Use waits for the spinner, the delayed button and the dialog.</p></section>';
}

/* ---------- accessibility names and roles, re-applied after every page change ---------- */
document.documentElement.lang='en';
var secN=0;

    var h=s.querySelector('h1,h2,h3');
    if(h&&!s.hasAttribute('aria-label')&&!s.hasAttribute('aria-labelledby')){if(!h.id)h.id='sec-h'+(++secN);s.setAttribute('aria-labelledby',h.id)}

  });

  Object.keys(tl).forEach(function(k){var tb=$('#'+k);if(tb)tb.setAttribute('aria-label',tl[k])});

  $$('#products article.card',main).forEach(function(a){

  $$('#cart-table tbody tr',main).forEach(function(r){var b=r.querySelector('button');if(b)b.setAttribute('aria-label','Remove '+r.cells[0].textContent)});
  $$('.chip',main).forEach(function(c){c.setAttribute('role','button');c.setAttribute('tabindex','0');c.setAttribute('aria-label','Drag '+c.dataset.name)});
  var dz=$('#drop-zone',main);if(dz)dz.setAttribute('role','region');
  var hb=$('#hover-btn',main);
  if(hb){hb.setAttribute('aria-haspopup','menu');$('#hover-list').setAttribute('role','menu');$$('#hover-list li').forEach(function(li){li.setAttribute('role','none')});$$('#hover-list a').forEach(function(a){a.setAttribute('role','menuitem')})}
  ['terms','reg-terms'].forEach(function(id){var e=$('#'+id,main);if(e)e.setAttribute('aria-required','true')});
  $$('.fielderr[id^="err-"]',main).forEach(function(p){
    var c=$('#'+p.id.slice(4),main)||p.closest('fieldset');
    if(c&&!c.hasAttribute('aria-describedby'))c.setAttribute('aria-describedby',p.id);
  });
}
new MutationObserver(a11y).observe(main,{childList:true,subtree:true});

chrome();
route();
a11y();
})();
